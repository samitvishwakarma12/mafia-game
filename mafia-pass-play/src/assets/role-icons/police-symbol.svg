  <path d="M128 50 L182 68 V120 C182 158 158 186 128 204 C98 186 74 158 74 120 V68 Z" fill="none" stroke="#D9A93B" stroke-width="2" opacity="0.6"/>
  <polygon points="128,80 136.8,105.9 164.1,106.3 142.3,122.6 150.3,148.7 128,133 105.7,148.7 113.7,122.6 91.9,106.3 119.2,105.9" fill="#D9A93B"/>
