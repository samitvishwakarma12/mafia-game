<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Village cottage">
  <title>Villager (symbol)</title>
  <style>
    .vs-smoke { transform-box: fill-box; transform-origin: center; animation: vs-smoke 4s ease-out infinite; opacity: 0; }
    .vs-smoke.b { animation-delay: 2s; }
    @keyframes vs-smoke {
      0% { transform: translate(0,0) scale(0.6); opacity: 0; }
      15% { opacity: 0.8; }
      100% { transform: translate(8px,-34px) scale(1.4); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .vs-smoke { opacity: 0.6; } }
  </style>

  <circle cx="128" cy="128" r="120" fill="#E5EEDA"/>
  <ellipse cx="128" cy="192" rx="84" ry="9" fill="#7BA05B" opacity="0.55"/>
  <!-- chimney + smoke -->
  <rect x="154" y="74" width="16" height="34" fill="#6E3A29"/>
  <circle class="vs-smoke" cx="162" cy="68" r="7" fill="#B8C2C8"/>
  <circle class="vs-smoke b" cx="162" cy="68" r="7" fill="#B8C2C8"/>
  <!-- walls -->
  <rect x="78" y="116" width="100" height="74" fill="#E9D9B5"/>
  <!-- roof -->
  <path d="M58 122 L128 62 L198 122 Z" fill="#8C4A32"/>
  <path d="M58 122 L198 122" stroke="#6E3A29" stroke-width="4"/>
  <!-- door -->
  <path d="M114 190 V152 C114 143 142 143 142 152 V190 Z" fill="#7A5230"/>
  <circle cx="136" cy="172" r="2.5" fill="#E9D9B5"/>
  <!-- window -->
  <rect x="152" y="138" width="20" height="20" rx="2" fill="#9CC7E0" stroke="#7A5230" stroke-width="3"/>
  <path d="M162 138 V158 M152 148 H172" stroke="#7A5230" stroke-width="2"/>
  <!-- left window -->
  <rect x="84" y="138" width="20" height="20" rx="2" fill="#9CC7E0" stroke="#7A5230" stroke-width="3"/>
  <path d="M94 138 V158 M84 148 H104" stroke="#7A5230" stroke-width="2"/>
</svg>
